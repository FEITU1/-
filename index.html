<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>幸存者试炼 · 正式版</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a2616;
    font-family:system-ui,"Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  canvas{display:block;cursor:default;touch-action:none;}

  #errBox{
    position:fixed;left:12px;top:12px;z-index:99;max-width:70vw;
    display:none;padding:10px 14px;border-radius:8px;
    background:rgba(120,20,20,.9);color:#ffd7d0;
    font:12px/1.5 Consolas,monospace;white-space:pre-wrap;
  }

  #screen{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%, #22331c 0%, #0a1108 75%);
    color:#e8f5e0;text-align:center;
    padding:20px;box-sizing:border-box;
  }
  #screen.hidden{display:none;}

  #screen h1{
    font-size:54px;margin:0 0 12px;letter-spacing:6px;
    background:linear-gradient(180deg,#eaf5dd,#8fc46a);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(140,220,90,.35);
  }
  #screen h1.lose{
    background:linear-gradient(180deg,#ffc8c0,#c94030);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(255,80,60,.4);
  }
  #screen h1.win{
    background:linear-gradient(180deg,#fff3c0,#ffc22e);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 50px rgba(255,210,60,.6);
  }

  #screen .subtitle{
    font-size:15px;color:rgba(200,225,180,.65);
    line-height:1.9;margin-bottom:28px;max-width:620px;
  }
  #screen .subtitle b{color:#a8e06b;font-weight:600;}

  .main-menu{display:flex;gap:22px;margin-bottom:32px;justify-content:center;flex-wrap:wrap;}
  #screen .menu-btn{
    padding:18px 52px;border-radius:14px;border:2px solid;
    font-size:17px;font-weight:700;letter-spacing:3px;
    cursor:pointer;font-family:inherit;
    transition:transform .14s, box-shadow .14s;
  }
  #screen .menu-btn.battle{
    color:#0e1a08; border-color:#a8e06b;
    background:linear-gradient(170deg,#c8f58e,#7cc048);
    box-shadow:0 12px 34px rgba(120,210,60,.4),
               inset 0 1px 0 rgba(255,255,255,.55);
  }
  #screen .menu-btn.battle:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px rgba(140,220,80,.55),
               inset 0 1px 0 rgba(255,255,255,.65);
  }
  #screen .menu-btn.train{
    color:#fff4dc; border-color:#ffb84a;
    background:linear-gradient(170deg,#ffcf6b,#e08a20);
    box-shadow:0 12px 34px rgba(220,140,40,.4),
               inset 0 1px 0 rgba(255,255,255,.5);
  }
  #screen .menu-btn.train:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px rgba(240,170,50,.55),
               inset 0 1px 0 rgba(255,255,255,.65);
  }
  #screen .menu-btn:active{transform:translateY(1px);}

  .talents{display:flex;gap:22px;margin-bottom:32px;justify-content:center;flex-wrap:wrap;}
  .talent-card{
    width:250px;padding:24px 20px 22px;border-radius:16px;
    background:linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:2px solid rgba(150,200,130,.28);
    cursor:pointer;transition:transform .18s, border-color .18s, box-shadow .18s, background .18s;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .talent-card:hover{
    transform:translateY(-6px);
    border-color:var(--tcolor,#a8e06b);
    background:linear-gradient(165deg, rgba(168,224,107,.14), rgba(255,255,255,.02));
    box-shadow:0 20px 42px rgba(0,0,0,.5), 0 0 34px var(--tglow, rgba(168,224,107,.4));
  }
  .talent-card:active{transform:translateY(-2px);}
  .talent-icon{
    font-size:50px;line-height:1;margin-bottom:14px;
    filter:drop-shadow(0 0 16px var(--tglow, rgba(168,224,107,.5)));
  }
  .talent-name{
    font-size:17px;font-weight:700;color:#eaf5dd;
    margin-bottom:9px;letter-spacing:1.5px;
  }
  .talent-desc{
    font-size:13px;color:rgba(200,225,180,.72);
    line-height:1.75;
  }
  .talent-desc b{color:var(--tcolor,#a8e06b);font-weight:700;}

  #screen .stats{
    font-size:14px;color:rgba(200,225,180,.75);
    line-height:2.1;margin-bottom:32px;
  }
  #screen .stats span{color:#ffd94a;font-weight:700;font-size:17px;}

  #screen button.retry-btn{
    padding:16px 48px;border-radius:14px;border:2px solid #a8e06b;
    font-size:17px;font-weight:700;letter-spacing:3px;
    color:#0e1a08;cursor:pointer;font-family:inherit;
    background:linear-gradient(170deg,#c8f58e,#7cc048);
    box-shadow:0 12px 34px rgba(120,210,60,.4),
               inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .14s,box-shadow .14s;
  }
  #screen button.retry-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px rgba(140,220,80,.55),
               inset 0 1px 0 rgba(255,255,255,.65);
  }
  #screen button.retry-btn:active{transform:translateY(1px);}

  #screen .hint{
    margin-top:22px;font-size:12.5px;color:rgba(180,200,170,.4);
    letter-spacing:1px;
  }

  #panel{
    position:fixed;inset:0;z-index:20;
    display:none;align-items:center;justify-content:center;
    background:rgba(4,9,5,.72);
    color:#e6f0e0;user-select:none;
    padding:16px;box-sizing:border-box;
  }
  #panel.open{display:flex;}

  .panel-box{
    display:flex;gap:24px;padding:22px 26px 20px;
    max-width:96vw;max-height:92vh;overflow:auto;border-radius:16px;
    background:linear-gradient(165deg,#1e2d19,#101a0e 70%);
    border:1px solid #3b5533;
    box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07);
  }
  .col-title{
    font-size:13px;letter-spacing:3px;color:#a8c79a;
    margin-bottom:14px;padding-bottom:9px;
    border-bottom:1px solid rgba(140,180,120,.18);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .col-title small{letter-spacing:0;font-size:11px;font-weight:400;color:rgba(180,210,170,.38);}

  .paperdoll{
    display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(3,78px);
    gap:10px;margin:0 auto 18px;
  }
  .slot{
    position:relative;border-radius:11px;background:rgba(255,255,255,.035);
    border:2px dashed rgba(150,190,130,.22);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .slot .icon{font-size:34px;line-height:1;transform:translateY(-5px);}
  .slot .slot-label{
    position:absolute;bottom:4px;left:0;right:0;text-align:center;
    font-size:10px;letter-spacing:.5px;color:rgba(200,220,190,.42);
  }
  .slot.filled{
    cursor:pointer;border-style:solid;
    border-color:var(--rarity,rgba(180,220,150,.5));
    background:rgba(120,180,90,.10);
  }
  .slot.filled:hover{background:rgba(180,230,140,.17);box-shadow:0 0 16px rgba(150,220,110,.28);}
  .slot.filled.gold{background:rgba(255,215,60,.10);box-shadow:inset 0 0 14px rgba(255,215,60,.18);}
  .slot.filled.gold:hover{background:rgba(255,225,90,.20);box-shadow:0 0 22px rgba(255,215,60,.5);}

  .lvl-badge{
    position:absolute;
    top:-6px;right:-6px;
    padding:2px 6px;
    border-radius:8px;
    background:linear-gradient(170deg,#fff7c8,#ffc22e);
    border:1.5px solid #a06000;
    color:#3a2400;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.3px;
    text-align:center;
    line-height:1.15;
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 12px rgba(255,205,60,.6);
    pointer-events:none;
    z-index:2;
  }
  .slot .lvl-badge{
    top:-7px;right:-7px;
    font-size:11px;
  }

  .stat-list{
    border-top:1px solid rgba(140,180,120,.15);padding-top:12px;
    font-size:12.5px;display:flex;flex-direction:column;gap:7px;
  }
  .stat-row{display:flex;justify-content:space-between;color:rgba(200,220,190,.6);}
  .stat-row b{color:#c8e8a8;font-weight:600;}
  .stat-row.gold b{color:#ffd94a;text-shadow:0 0 8px rgba(255,205,50,.55);}

  .bag-grid{
    display:grid;grid-template-columns:repeat(5,64px);grid-auto-rows:64px;
    gap:8px;min-height:200px;min-width:352px;align-content:start;
  }
  .bag-empty{
    grid-column:1/-1;text-align:center;padding-top:60px;
    color:rgba(180,200,170,.3);font-size:13px;
  }
  .item{
    position:relative;border-radius:9px;background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.10);border-bottom:3px solid var(--rarity,#9aa89a);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;
  }
  .item:hover{
    transform:translateY(-3px);background:rgba(160,220,130,.14);
    box-shadow:0 0 0 2px var(--rarity,#a8e06b),0 8px 16px rgba(0,0,0,.45);
  }
  .item.gold{
    background:linear-gradient(160deg,rgba(255,215,60,.16),rgba(160,110,20,.10));
    box-shadow:inset 0 0 12px rgba(255,215,60,.20);
  }
  .item.gold:hover{box-shadow:0 0 0 2px #ffd94a,0 0 24px rgba(255,215,60,.6);}

  #tooltip{
    position:fixed;z-index:40;pointer-events:none;
    max-width:280px;padding:11px 14px;border-radius:10px;
    background:rgba(10,18,9,.97);border:1px solid rgba(140,190,120,.35);
    box-shadow:0 12px 30px rgba(0,0,0,.6);
    opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;
  }
  #tooltip.show{opacity:1;transform:translateY(0);}
  #tooltip.gold{
    border-color:rgba(255,215,60,.7);
    box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 30px rgba(255,205,50,.28);
  }
  .tt-name{font-size:14px;font-weight:700;margin-bottom:2px;}
  .tt-sub{font-size:10.5px;color:rgba(180,205,170,.45);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;}
  .tt-sub .lv{
    color:#ffd94a;font-weight:700;letter-spacing:.3px;
    text-shadow:0 0 8px rgba(255,205,50,.6);
  }
  .tt-stats{font-size:12px;color:#a6e07a;line-height:1.7;margin-bottom:7px;}
  .tt-stats .ls{color:#ff8fa0;}
  .tt-stats .up{
    color:#ffd94a;font-size:10.5px;
    margin-left:4px;letter-spacing:.2px;
  }
  .tt-desc{font-size:11.5px;line-height:1.55;color:rgba(200,215,195,.55);}

  .top-btn{
    position:fixed;
    top:16px;
    width:54px;height:54px;
    border-radius:14px;
    border:2px solid rgba(168,224,107,.5);
    background:rgba(15,25,12,.85);
    color:#eaf5dd;
    font-size:24px;
    cursor:pointer;
    display:none;
    align-items:center;justify-content:center;
    z-index:40;
    user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .1s,background .1s,box-shadow .1s;
    box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
    font-family:inherit;
  }
  .top-btn:hover{background:rgba(60,100,45,.9);}
  .top-btn:active{transform:scale(0.92);}
  #btnHome{left:16px;}
  #btnBag{right:16px;}

  #mobileUI{display:none;}
  @media (pointer:coarse){
    #mobileUI{display:block;}
  }

  #joystick{
    position:fixed;
    left:28px;
    bottom:28px;
    width:160px;height:160px;
    z-index:35;
    touch-action:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #joystickBase{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(35,55,28,.55), rgba(12,20,10,.75));
    border:3px solid rgba(168,224,107,.35);
    box-shadow:inset 0 0 24px rgba(0,0,0,.6),
               0 0 24px rgba(0,0,0,.4);
  }
  #joystickKnob{
    position:absolute;
    left:50%;top:50%;
    width:68px;height:68px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d8ffa8, #7cc048 60%, #4d8a20);
    border:2px solid rgba(220,255,170,.85);
    transform:translate(-50%,-50%);
    box-shadow:0 6px 18px rgba(0,0,0,.6),
               inset 0 2px 4px rgba(255,255,255,.4);
    pointer-events:none;
    transition:transform .05s linear;
  }

  @media (max-width:480px){
    #joystick{width:130px;height:130px;}
    #joystickKnob{width:56px;height:56px;}
    .top-btn{width:46px;height:46px;font-size:20px;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="errBox"></div>

<button id="btnHome" class="top-btn" title="返回主菜单">🏠</button>
<button id="btnBag" class="top-btn" title="背包">🎒</button>

<div id="mobileUI">
  <div id="joystick">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>
</div>

<div id="screen">
  <h1 id="screenTitle">幸存者试炼</h1>
  <div class="subtitle" id="screenSub">
    <b>WASD / 摇杆</b> 移动 · <b>全自动战斗 + 自动装备</b><br>
    攻击、剑气、旋风都会自动释放，捡到更强的装备自动换上
  </div>

  <div class="main-menu" id="mainMenuArea">
    <button class="menu-btn battle" data-mode="battle">⚔ 开始游戏</button>
    <button class="menu-btn train" data-mode="train">🎯 训练模式</button>
  </div>

  <div class="talents" id="talentArea" style="display:none;">
    <div class="talent-card" data-talent="aura"
         style="--tcolor:#7fd0ff;--tglow:rgba(127,208,255,.55)">
      <div class="talent-icon">🌀</div>
      <div class="talent-name">剑气宗师</div>
      <div class="talent-desc">
        剑气范围 <b>4 倍</b> · 伤害 <b>2 倍</b><br>
        （超大范围横扫千军）
      </div>
    </div>
    <div class="talent-card" data-talent="spin"
         style="--tcolor:#a8e06b;--tglow:rgba(168,224,107,.55)">
      <div class="talent-icon">⚡</div>
      <div class="talent-name">疾风之刃</div>
      <div class="talent-desc">
        旋风冷却时间 <b>减半</b><br>
        （6 秒 → 3 秒）
      </div>
    </div>
  </div>

  <div class="stats" id="screenStats" style="display:none;"></div>
  <button class="retry-btn" id="screenBtn" style="display:none;">返 回 主 菜 单</button>
  <div class="hint" id="screenHint">选择模式，开始试炼。</div>
</div>

<div id="panel">
  <div class="panel-box">
    <div class="col">
      <div class="col-title">装 备 <small>自动装备</small></div>
      <div class="paperdoll">
        <div class="slot" data-slot="helmet" style="grid-area:1/2">
          <span class="icon"></span><span class="slot-label">头盔</span>
        </div>
        <div class="slot" data-slot="weapon" style="grid-area:2/1">
          <span class="icon"></span><span class="slot-label">剑</span>
        </div>
        <div class="slot" data-slot="armor" style="grid-area:2/2">
          <span class="icon"></span><span class="slot-label">盔甲</span>
        </div>
        <div class="slot" data-slot="boots" style="grid-area:3/2">
          <span class="icon"></span><span class="slot-label">鞋子</span>
        </div>
      </div>
      <div class="stat-list">
        <div class="stat-row"><span>额外攻击力</span><b id="statAtk">+0</b></div>
        <div class="stat-row"><span>暴击率</span><b id="statCrit">18%</b></div>
        <div class="stat-row"><span>攻击范围</span><b id="statRange">+0</b></div>
        <div class="stat-row"><span>移动速度</span><b id="statSpeed">+0</b></div>
        <div class="stat-row gold"><span>吸血</span><b id="statLifesteal">0%</b></div>
      </div>
    </div>
    <div class="col">
      <div class="col-title">背 包 <small>自动装备</small></div>
      <div class="bag-grid" id="bagGrid"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
'use strict';
const errBox = document.getElementById('errBox');
window.addEventListener('error', ev => {
  errBox.style.display = 'block';
  errBox.textContent = '脚本错误：\n' + (ev.message || ev.error) +
                       '\n@' + (ev.filename || '') + ':' + (ev.lineno || '');
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);

function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function roundRect(x, y, w, h, r) {
  if (!(w > 0) || !(h > 0)) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function safeRadial(x0, y0, r0, x1, y1, r1) {
  r0 = Math.max(0.01, r0);
  r1 = Math.max(r0 + 0.01, r1);
  return ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
}
function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

let W = 1, H = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

const WORLD = { w: 2400, h: 1800 };
const ground = document.createElement('canvas');
ground.width = WORLD.w;
ground.height = WORLD.h;
(function buildGround() {
  const g = ground.getContext('2d');
  g.fillStyle = '#24331f';
  g.fillRect(0, 0, WORLD.w, WORLD.h);
  for (let i = 0; i < 600; i++) {
    g.beginPath();
    g.arc(rand(0, WORLD.w), rand(0, WORLD.h), rand(20, 140), 0, TAU);
    g.fillStyle = Math.random() < 0.5 ? 'rgba(62,95,48,0.10)' : 'rgba(18,32,16,0.13)';
    g.fill();
  }
  for (let i = 0; i < 4200; i++) {
    const x = rand(0, WORLD.w), y = rand(0, WORLD.h);
    const a = rand(0, TAU), l = rand(3, 9);
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.strokeStyle = `rgba(${rand(70,125)|0},${rand(115,170)|0},${rand(60,95)|0},${rand(0.15,0.4).toFixed(2)})`;
    g.lineWidth = 1;
    g.stroke();
  }
})();

const RARITY = {
  common: { color:'#9aa89a', name:'普通' },
  good:   { color:'#6fdc6f', name:'优秀' },
  rare:   { color:'#5cb8ff', name:'稀有' },
  epic:   { color:'#c07cff', name:'史诗' },
  gold:   { color:'#ffd94a', name:'传说' },
};
const SLOT_NAMES = { helmet:'头盔', armor:'盔甲', weapon:'剑', boots:'鞋子' };

const ITEM_DEFS = {

const LEVEL_BONUS = 0.20;

function getItemStats(item) {
  const def = ITEM_DEFS[item.defId];
  if (!def) return {};
  const base = def.stats || {};
  const lvl = item.level || 1;
  const mul = 1 + (lvl - 1) * LEVEL_BONUS;
  const out = {};
  for (const k in base) out[k] = base[k] * mul;
  return out;
}

/* ★ 物品评分（用于自动装备判断） */
const RARITY_BONUS = { common:0, good:10, rare:30, epic:60, gold:120 };
function scoreItem(item) {
  const def = ITEM_DEFS[item.defId];
  if (!def) return 0;
  const st = getItemStats(item);
  const rarBonus = RARITY_BONUS[def.rarity] || 0;
  let score = 0;
  score += (st.atk       || 0) * 4;       // 攻击力权重
  score += (st.crit      || 0) * 500;     // 暴击率权重（1% = 5分）
  score += (st.range     || 0) * 3;       // 攻击范围（同时影响拾取/旋风）
  score += (st.speed     || 0) * 1;       // 移动速度
  score += (st.lifesteal || 0) * 500;     // 吸血权重（1% = 5分）
  return score + rarBonus;
}

/* ★ 自动装备最强装备 */
function autoEquipBest(silent) {
  const slots = ['weapon', 'helmet', 'armor', 'boots'];
  let changed = false;
  const changes = [];
  for (const slot of slots) {
    let bestItem = equipped[slot];
    let bestScore = bestItem ? scoreItem(bestItem) : -Infinity;
    for (const it of inventory) {
      const def = ITEM_DEFS[it.defId];
      if (!def || def.slot !== slot) continue;
      const s = scoreItem(it);
      if (s > bestScore) {
        bestScore = s;
        bestItem = it;
      }
    }
    if (bestItem && bestItem !== equipped[slot]) {
      const prev = equipped[slot];
      const idx = inventory.indexOf(bestItem);
      if (idx >= 0) inventory.splice(idx, 1);
      equipped[slot] = bestItem;
      if (prev) inventory.push(prev);
      changed = true;
      changes.push(ITEM_DEFS[bestItem.defId].name);
    }
  }
  if (changed) {
    computeStats();
    renderPanel();
    if (!silent && changes.length > 0) {
      texts.push({
        x: player.x, y: player.y - player.r - 48,
        vy: -40, life: 1.3, max: 1.3,
        text: '⚡ 自动装备：' + changes.join(' / '),
        autoEquip: true
      });
    }
  }
  return changed;
}

const BASE_STATS = { atk:0, crit:0.18, range:0, speed:0, lifesteal:0 };
let stats = Object.assign({}, BASE_STATS);

let uidCounter = 0;
const makeItem = (defId, level) => ({ uid: ++uidCounter, defId, level: level || 1 });

const inventory = [
  'wood_sword','cloth_hat','cloth_armor','straw_shoes',
].map(k => makeItem(k, 1));

const equipped = { helmet:null, armor:null, weapon:null, boots:null };

function computeStats() {
  const s = Object.assign({}, BASE_STATS);
  for (const slot in equipped) {
    const it = equipped[slot];
    if (!it) continue;
    const st = getItemStats(it);
    s.atk       += st.atk       || 0;
    s.crit      += st.crit      || 0;
    s.range     += st.range     || 0;
    s.speed     += st.speed     || 0;
    s.lifesteal += st.lifesteal || 0;
  }
  s.atk   = Math.round(s.atk);
  s.range = Math.round(s.range);
  s.speed = Math.round(s.speed);
  stats = s;
}
function equipItem(item) {
  const def = ITEM_DEFS[item.defId];
  if (!def) return;
  const slot = def.slot;
  const idx = inventory.indexOf(item);
  if (idx < 0) return;
  inventory.splice(idx, 1);
  const prev = equipped[slot];
  equipped[slot] = item;
  if (prev) inventory.push(prev);
  computeStats();
  renderPanel();
}
function unequip(slot) {
  const it = equipped[slot];
  if (!it) return;
  equipped[slot] = null;
  inventory.push(it);
  computeStats();
  renderPanel();
  /* 卸下后自动装备可能又会把它装回来（如果还是最强的），所以这里不自动重装 */
}

const panelEl   = document.getElementById('panel');

function statLines(st) {
  const out = [];
  if (st.atk)       out.push('+' + Math.round(st.atk) + ' 攻击力');
  if (st.crit)      out.push('+' + Math.round(st.crit * 100) + '% 暴击率');
  if (st.range)     out.push('+' + Math.round(st.range) + ' 攻击范围');
  if (st.speed)     out.push('+' + Math.round(st.speed) + ' 移动速度');
  if (st.lifesteal) out.push('<span class="ls">+' + Math.round(st.lifesteal * 100) + '% 吸血</span>');
  return out.map(t => '<div>' + t + '</div>').join('');
}
function makeLevelBadge(level) {
  const badge = document.createElement('span');
  badge.className = 'lvl-badge';
  badge.textContent = 'Lv.' + level;
  return badge;
}
function renderPanel() {
  document.querySelectorAll('.slot').forEach(el => {
    const slot = el.dataset.slot;
    const it = equipped[slot];
    const iconEl = el.querySelector('.icon');
    const old = el.querySelector('.lvl-badge');
    if (old) old.remove();
    if (it) {
      const def = ITEM_DEFS[it.defId];
      iconEl.textContent = def.icon;
      el.classList.add('filled');
      el.classList.toggle('gold', def.rarity === 'gold');
      el.style.setProperty('--rarity', RARITY[def.rarity].color);
      el.dataset.uid = it.uid;
      el.appendChild(makeLevelBadge(it.level));
    } else {
      iconEl.textContent = '';
      el.classList.remove('filled');
      el.classList.remove('gold');
      el.style.removeProperty('--rarity');
      delete el.dataset.uid;
    }
  });
  bagGrid.innerHTML = '';
  if (inventory.length === 0) {
    bagGrid.innerHTML = '<div class="bag-empty">背包空空如也</div>';
  } else {
    for (const it of inventory) {
      const def = ITEM_DEFS[it.defId];
      const el = document.createElement('div');
      el.className = 'item' + (def.rarity === 'gold' ? ' gold' : '');
      el.dataset.uid = it.uid;
      el.style.setProperty('--rarity', RARITY[def.rarity].color);
      el.innerHTML = '<span>' + def.icon + '</span>';
      el.appendChild(makeLevelBadge(it.level));
      bagGrid.appendChild(el);
    }
  }
  document.getElementById('statAtk').textContent       = '+' + stats.atk;
  document.getElementById('statCrit').textContent      = Math.round(stats.crit * 100) + '%';
  document.getElementById('statRange').textContent     = '+' + stats.range;
  document.getElementById('statSpeed').textContent     = '+' + stats.speed;
  document.getElementById('statLifesteal').textContent = Math.round(stats.lifesteal * 100) + '%';
}
function positionTooltip(e) {
  const r = tooltipEl.getBoundingClientRect();
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + r.width  > window.innerWidth  - 10) x = e.clientX - r.width  - 18;
  if (y + r.height > window.innerHeight - 10) y = e.clientY - r.height - 18;
  tooltipEl.style.left = x + 'px';
  tooltipEl.style.top  = y + 'px';
}
function showTooltip(item, e) {
  const def = ITEM_DEFS[item.defId];
  const rar = RARITY[def.rarity];
  const isGold = def.rarity === 'gold';
  const lvl = item.level || 1;
  const scaled = getItemStats(item);
  tooltipEl.classList.toggle('gold', isGold);
  const lvTag = '<span class="lv">Lv.' + lvl + '</span>';
  const upTag = lvl > 1
    ? '<span class="up">（+' + Math.round((lvl - 1) * LEVEL_BONUS * 100) + '%）</span>'
    : '';
  tooltipEl.innerHTML =
    '<div class="tt-name" style="color:' + rar.color + (isGold ? ';text-shadow:0 0 10px rgba(255,205,50,.8)' : '') + '">' +
      (isGold ? '★ ' : '') + def.name +
    '</div>' +
    '<div class="tt-sub"><span>' + rar.name + ' · ' + SLOT_NAMES[def.slot] + '</span>' + lvTag + '</div>' +
    '<div class="tt-stats">' + statLines(scaled) + upTag + '</div>' +
    '<div class="tt-desc">' + def.desc + '</div>';
  tooltipEl.classList.add('show');
  positionTooltip(e);
}
function hideTooltip() {
  tooltipEl.classList.remove('show');
  tooltipEl.classList.remove('gold');
}
bagGrid.addEventListener('click', e => {
  const el = e.target.closest('.item');
  if (!el) return;
  const uid = +el.dataset.uid;
  const item = inventory.find(i => i.uid === uid);
  if (item) equipItem(item);
});
document.querySelector('.paperdoll').addEventListener('click', e => {
  const el = e.target.closest('.slot');
  if (!el) return;
  if (equipped[el.dataset.slot]) unequip(el.dataset.slot);
});
panelEl.addEventListener('mouseover', e => {
  const el = e.target.closest('.item, .slot');
  if (!el) { hideTooltip(); return; }
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  let item = null;
  if (el.classList.contains('item')) item = inventory.find(i => i.uid === +el.dataset.uid);
  else if (el.classList.contains('filled')) item = equipped[el.dataset.slot];
  if (item) showTooltip(item, e); else hideTooltip();
});
panelEl.addEventListener('mouseout', e => {
  const el = e.target.closest('.item, .slot');
  if (!el) return;
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  hideTooltip();
});
panelEl.addEventListener('mousemove', e => {
  if (tooltipEl.classList.contains('show')) positionTooltip(e);
});

        target = equipped[slot];
        break;

  joystickActive = false;
  joystickVecX = 0;
  joystickVecY = 0;
  joystickPointerId = null;
  if (knobEl) knobEl.style.transform = 'translate(-50%,-50%)';
}

function handleJoystickMove(cx, cy) {
  let dx = cx - joystickCX;
  let dy = cy - joystickCY;
  const maxR = joystickEl.clientWidth * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > maxR) {
    dx = dx / len * maxR;
    dy = dy / len * maxR;
  }
  joystickVecX = dx / maxR;
  joystickVecY = dy / maxR;
  knobEl.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

joystickEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (joystickPointerId !== null) return;
  if (GAME.state !== 'playing') return;
  joystickPointerId = e.pointerId;
  try { joystickEl.setPointerCapture(e.pointerId); } catch (err) {}
  const rect = joystickEl.getBoundingClientRect();
  joystickCX = rect.left + rect.width / 2;
  joystickCY = rect.top + rect.height / 2;
  joystickActive = true;
  handleJoystickMove(e.clientX, e.clientY);
});
joystickEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joystickPointerId) return;
  e.preventDefault();
  handleJoystickMove(e.clientX, e.clientY);
});
joystickEl.addEventListener('pointerup', e => {
  if (e.pointerId !== joystickPointerId) return;
  e.preventDefault();
  resetJoystick();
});
joystickEl.addEventListener('pointercancel', e => {
  if (e.pointerId !== joystickPointerId) return;
  resetJoystick();
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

const btnHome = document.getElementById('btnHome');
const btnBag = document.getElementById('btnBag');

function requestReturnToMenu() {
  if (GAME.state !== 'playing') return;
  if (!confirm('返回主菜单？当前进度将丢失。')) return;
  showMainMenu();
}
btnHome.addEventListener('click', e => {
  e.preventDefault();
  requestReturnToMenu();
});
btnBag.addEventListener('click', e => {
  e.preventDefault();
  if (GAME.state !== 'playing') return;
  togglePanel();
});

function togglePanel() {
  if (GAME.state !== 'playing') return;
  panelOpen = !panelOpen;
  panelEl.classList.toggle('open', panelOpen);
  if (panelOpen) {
    for (const k in keys) keys[k] = false;
    resetJoystick();
    renderPanel();
  } else {
    hideTooltip();
  }
}

function camTarget(pos, view, world) {
  const m = world - view;
  if (m <= 0) return m / 2;
  return clamp(pos - view / 2, 0, m);
}
function snapCamera() {
  cam.x = camTarget(player.x, W, WORLD.w);
  cam.y = camTarget(player.y, H, WORLD.h);
}

function applyLifesteal(dmg) {
  if (player.dead) return;
  if (stats.lifesteal <= 0) return;
  const heal = Math.round(dmg * stats.lifesteal);
  if (heal <= 0) return;
  const before = player.hp;
  player.hp = Math.min(player.maxHp, player.hp + heal);
  const real = Math.round(player.hp - before);
  if (real <= 0) return;
  texts.push({
    x: player.x + rand(-8, 8), y: player.y - player.r - 26,
    vy: -58, life: 0.85, max: 0.85,
    text: '+' + real, heal: true
  });
  for (let i = 0; i < 5; i++) {
    const a = rand(0, TAU), s = rand(30, 120);
    particles.push({
      x: player.x + rand(-6, 6), y: player.y + rand(-6, 6),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
      life: rand(0.3, 0.6), max: 0.6,
      size: rand(2, 3.5), color: '#ff6b8a'
    });
  }
}

function currentRange() { return ATK.range + stats.range; }

function dealDamage(target, isEnemy, mul, isSkill) {
  mul = mul || 1;
  const crit = Math.random() < stats.crit;
  let dmg = Math.round((rand(11, 17) + stats.atk) * mul);
  if (crit) dmg *= 2;
  target.hp = Math.max(0, target.hp - dmg);
  target.flash = 0.16;
  target.wobble = 0.55;
  shake = Math.min(0.42, shake + (crit ? 0.24 : (isSkill ? 0.16 : 0.1)));
  texts.push({
    x: target.x + rand(-10, 10), y: target.y - target.r - 14,
    vy: -78, life: 0.95, max: 0.95,
    text: String(dmg), crit, skill: !!isSkill
  });
  applyLifesteal(dmg);
  const ang = Math.atan2(target.y - player.y, target.x - player.x);
  const n = crit ? 20 : (isSkill ? 18 : 12);
  for (let i = 0; i < n; i++) {
    const a = ang + rand(-1.3, 1.3);
    const s = rand(70, 270) * (crit ? 1.4 : 1) * (isSkill ? 1.25 : 1);
    particles.push({
      x: target.x, y: target.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.7), max: 0.7,
      size: rand(2, 4.5),
      color: isSkill
        ? (crit ? '#ffffff' : (Math.random() < 0.5 ? '#bfe9ff' : '#69b8ff'))
        : (isEnemy
            ? (crit ? '#ffd36b' : (Math.random() < 0.5 ? '#ff8a6a' : '#b8281a'))
            : (crit ? '#ffd36b' : '#c99a5b'))
    });
  }
  if (isEnemy) {
    const kb = isSkill ? 420 : (target.isBoss ? 40 : 230);
    target.vx += Math.cos(ang) * kb;
    target.vy += Math.sin(ang) * kb;
    if (target.hp <= 0) killEnemy(target);
  } else {
    if (target.hp <= 0) destroyDummy();
  }
}

function destroyDummy() {
  dummy.dead = true;
  dummy.respawn = 1.8;
  shake = 0.45;
  for (let i = 0; i < 60; i++) {
    const a = rand(0, TAU), s = rand(60, 340);
    particles.push({
      x: dummy.x, y: dummy.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.4, 1.1), max: 1.1,
      size: rand(2, 6),
      color: Math.random() < 0.5 ? '#c99a5b' : '#7a5630'
    });
  }
  texts.push({
    x: dummy.x, y: dummy.y - 44,
    vy: -52, life: 1.3, max: 1.3,
    text: '击碎！', crit: true
  });
  dropFromDummy();
}

function killEnemy(e) {
  e.dead = true;
  GAME.killCount++;
  const isBoss = !!e.isBoss;
  const n = isBoss ? 80 : 26;
  const spd = isBoss ? 500 : 260;
  const colorSet = isBoss ? ['#ffffff', e.bossColor] : ['#ff8a6a', '#8f1f14'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(50, spd);
    particles.push({
      x: e.x, y: e.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.35, 1.1), max: 1.1,
      size: rand(2, 6),
      color: colorSet[Math.floor(Math.random() * colorSet.length)]
    });
  }
  if (isBoss) {
    shake = 0.85;
    GAME.bossActive = false;
    GAME.bossRef = null;
    GAME.nextBossIdx++;
    dropItem(e.x, e.y, true);
    texts.push({
      x: e.x, y: e.y - 60,
      vy: -30, life: 2.0, max: 2.0,
      text: '击败 ' + e.bossName + '！',
      bossWarning: true
    });
    if (GAME.nextBossIdx >= BOSS_DEFS.length) winGame();
  } else {
    dropItem(e.x, e.y, false);
  }
}

function damagePlayer(dmg) {
  if (player.invuln > 0 || player.dead) return;
  if (GAME.state !== 'playing') return;
  dmg = Math.round(dmg);
  player.hp = Math.max(0, player.hp - dmg);
  player.hurtFlash = 0.35;
  player.invuln = 0.45;
  shake = Math.min(0.4, shake + 0.14);
  texts.push({
    x: player.x + rand(-8, 8), y: player.y - player.r - 18,
    vy: -70, life: 0.9, max: 0.9, text: '-' + dmg, hurt: true
  });
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), s = rand(50, 180);
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.2, 0.5), max: 0.5,
      size: rand(2, 4), color: '#ff5c4d'
    });
  }
  if (player.hp <= 0) loseGame();
}

function castSkill1(targetAngle) {

  if (player.skill1.cd > 0) return;
  player.skill1.cd = SKILL1.cd;

  swordAuras.push({

    y: player.y + Math.sin(a) * 30,
    angle: a, speed: SKILL1.speed, r: SKILL1.radius,
    life: SKILL1.life, maxLife: SKILL1.life, hit: new Set()
  });
  shake = Math.min(0.45, shake + 0.2);
  for (let i = 0; i < 26; i++) {
    const ang = a + rand(-0.55, 0.55);
    const s = rand(120, 420);
    particles.push({
      x: player.x + Math.cos(a) * 24,
      y: player.y + Math.sin(a) * 24,
      vx: Math.cos(ang) * s, vy: Math.sin(ang) * s,
      life: rand(0.18, 0.45), max: 0.45,
      size: rand(2, 5),
      color: Math.random() < 0.5 ? '#ffffff' : '#8fd8ff'
    });
  }
  texts.push({
    x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40 - 22,
    vy: -46, life: 0.8, max: 0.8, text: '剑气！', skill: true
  });
}

function updateSwordAuras(dt) {
  for (let i = swordAuras.length - 1; i >= 0; i--) {
    const s = swordAuras[i];
    s.x += Math.cos(s.angle) * s.speed * dt;
    s.y += Math.sin(s.angle) * s.speed * dt;
    s.life -= dt;
    if (s.x < -120 || s.x > WORLD.w + 120 ||
        s.y < -120 || s.y > WORLD.h + 120 ||
        s.life <= 0) {
      for (let k = 0; k < 10; k++) {
        const a = rand(0, TAU), sp = rand(40, 160);
        particles.push({
          x: s.x, y: s.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: rand(0.2, 0.5), max: 0.5,
          size: rand(2, 4), color: '#8fd8ff'
        });
      }
      swordAuras.splice(i, 1);
      continue;
    }
    if (Math.random() < 0.9) {
      const pa = s.angle + Math.PI + rand(-0.5, 0.5);
      particles.push({
        x: s.x + rand(-6, 6), y: s.y + rand(-6, 6),
        vx: Math.cos(pa) * rand(20, 90), vy: Math.sin(pa) * rand(20, 90),
        life: rand(0.14, 0.34), max: 0.34,
        size: rand(1.5, 3.5),
        color: Math.random() < 0.5 ? '#dff4ff' : '#6cc0ff'
      });
    }
    for (const e of enemies) {
      if (e.dead || s.hit.has(e)) continue;
      const dx = e.x - s.x, dy = e.y - s.y;
      if (Math.hypot(dx, dy) < e.r + s.r) {
        s.hit.add(e);
        dealDamage(e, true, SKILL1.damageMul, true);
        burstAuraHit(s);
      }
    }
    if (GAME.mode === 'train' && !dummy.dead && !s.hit.has(dummy)) {
      const dx = dummy.x - s.x, dy = dummy.y - s.y;
      if (Math.hypot(dx, dy) < dummy.r + s.r) {
        s.hit.add(dummy);
        dealDamage(dummy, false, SKILL1.damageMul, true);
        burstAuraHit(s);
      }
    }
  }
}

function burstAuraHit(s) {
  for (let i = 0; i < 14; i++) {
    const a = rand(0, TAU), sp = rand(80, 300);
    particles.push({
      x: s.x, y: s.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.2, 0.5), max: 0.5,
      size: rand(2, 5),
      color: Math.random() < 0.5 ? '#ffffff' : '#7fd0ff'
    });
  }
}

function spinRange() { return currentRange() * SKILL_E.rangeMul; }

function castSkillE() {
  if (player.dead) return;
  if (player.skillE.cd > 0) return;
  if (player.skillE.active) return;
  player.skillE.active = true;
  player.skillE.t = 0;
  player.skillE.tickTimer = 0;
  player.skillE.cd = SKILL_E.cd;
  player.skillE.spinAngle = 0;
  doSpinDamage();
  shake = Math.min(0.45, shake + 0.22);
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * TAU + rand(-0.1, 0.1);
    const s = rand(240, 520);
    particles.push({
      x: player.x + Math.cos(a) * 26, y: player.y + Math.sin(a) * 26,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.22, 0.5), max: 0.5,
      size: rand(2, 5),
      color: Math.random() < 0.5 ? '#ffffff' : '#a8e06b'
    });
  }
  texts.push({
    x: player.x, y: player.y - player.r - 30,
    vy: -44, life: 0.9, max: 0.9, text: '旋风！', skill: true
  });
}

function doSpinDamage() {
  const R = spinRange();
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < R + e.r) dealDamage(e, true, SKILL_E.damageMul, false);
  }
  if (GAME.mode === 'train' && !dummy.dead) {
    const d = Math.hypot(dummy.x - player.x, dummy.y - player.y);
    if (d < R + dummy.r) dealDamage(dummy, false, SKILL_E.damageMul, false);
  }
}

function updateSkillE(dt) {
  if (player.skillE.cd > 0) player.skillE.cd = Math.max(0, player.skillE.cd - dt);
  if (!player.skillE.active) return;
  player.skillE.t += dt;
  player.skillE.spinAngle += dt * 18;
  if (player.skillE.spinAngle > TAU * 1000) player.skillE.spinAngle -= TAU * 1000;
  player.skillE.tickTimer += dt;
  while (player.skillE.tickTimer >= SKILL_E.tickInterval) {
    player.skillE.tickTimer -= SKILL_E.tickInterval;
    doSpinDamage();
  }
  if (player.skillE.t >= SKILL_E.duration) {
    player.skillE.active = false;
    player.skillE.t = 0;
    player.skillE.tickTimer = 0;
  }
  const R = spinRange();
  for (let i = 0; i < 2; i++) {
    if (Math.random() < 0.85) {
      const a = rand(0, TAU);
      const rr = R * rand(0.55, 1.05);
      const tangential = a + Math.PI / 2;
      particles.push({
        x: player.x + Math.cos(a) * rr, y: player.y + Math.sin(a) * rr,
        vx: Math.cos(tangential) * rand(120, 260),
        vy: Math.sin(tangential) * rand(120, 260),
        life: rand(0.16, 0.36), max: 0.36,
        size: rand(1.8, 3.8),
        color: Math.random() < 0.5 ? '#dff4ff' : '#a8e06b'
      });
    }
  }
}

function findNearestEnemy() {
  let nearest = null;
  let nearestDist = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < nearestDist) {
      nearestDist = d;
      nearest = e;
    }
  }
  if (GAME.mode === 'train' && !dummy.dead) {
    const d = Math.hypot(dummy.x - player.x, dummy.y - player.y);
    if (d < nearestDist) {
      nearestDist = d;
      nearest = dummy;
    }
  }
  return nearest;
}

function hasEnemyInSpinRange() {
  const R = spinRange();
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < R + e.r + 60) return true;
  }
  if (GAME.mode === 'train' && !dummy.dead) {
    const d = Math.hypot(dummy.x - player.x, dummy.y - player.y);
    if (d < R + dummy.r + 60) return true;
  }
  return false;
}

function autoCombat() {
  if (player.dead) return;
  const nearest = findNearestEnemy();
  if (nearest) {
    const dist = Math.hypot(nearest.x - player.x, nearest.y - player.y);
    if (dist < 600) {
      player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    }
  }
  if (player.atk.cd <= 0 && !player.atk.active && nearest) {
    const R = currentRange();
    const dist = Math.hypot(nearest.x - player.x, nearest.y - player.y);
    if (dist < R + nearest.r) {
      player.atk.active = true;
      player.atk.t = 0;
      player.atk.cd = ATK.cd;
      player.atk.hit.clear();
    }
  }
  if (player.skill1.cd <= 0 && nearest) {
    const ang = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    castSkill1(ang);
  }
  if (player.skillE.cd <= 0 && !player.skillE.active) {
    if (hasEnemyInSpinRange()) {
      castSkillE();
    }
  }
}

function processAttackHits() {
  if (!player.atk.active) return;
  const k = player.atk.t / ATK.dur;
  if (k <= 0.08) return;
  const R = currentRange();
  const tolBase = ATK.arc * 0.5;
  function checkTarget(t) {
    if (t.dead || player.atk.hit.has(t)) return;
    const dx = t.x - player.x, dy = t.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > R + t.r) return;
    const ang = Math.atan2(dy, dx);
    const tol = tolBase + Math.atan2(t.r, Math.max(dist, 1));
    if (Math.abs(angleDiff(ang, player.angle)) < tol) {
      player.atk.hit.add(t);
      dealDamage(t, t !== dummy, 1, false);
    }
  }
  for (const t of enemies) checkTarget(t);
  if (GAME.mode === 'train' && !dummy.dead) checkTarget(dummy);
}

function updateDummy(dt) {
  if (GAME.mode !== 'train') return;
  if (dummy.flash > 0)  dummy.flash -= dt;
  if (dummy.wobble > 0) dummy.wobble = Math.max(0, dummy.wobble - dt * 2.2);
  dummy.hpShown += (dummy.hp - dummy.hpShown) * Math.min(1, dt * 12);
  if (dummy.dead) {
    dummy.respawn -= dt;
    if (dummy.respawn <= 0) {
      dummy.dead = false;
      dummy.hp = dummy.maxHp;
      dummy.hpShown = dummy.maxHp;
      dummy.flash = 0;
      dummy.wobble = 0;
      for (let i = 0; i < 24; i++) {
        const a = rand(0, TAU), s = rand(40, 130);
        particles.push({
          x: dummy.x, y: dummy.y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: rand(0.3, 0.6), max: 0.6,
          size: rand(2, 4), color: '#a8e06b'
        });
      }
    }
  }
}

function update(dt) {
  if (GAME.state !== 'playing') {
    if (GAME.state === 'won' || GAME.state === 'lost') {
      updateEffects(dt);
      updateCamera(dt);
      if (shake > 0) shake = Math.max(0, shake - dt * 1.6);
    }
    return;
  }

  time += dt;
  GAME.time += dt;

  if (player.hurtFlash > 0) player.hurtFlash -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.skill1.cd > 0) player.skill1.cd = Math.max(0, player.skill1.cd - dt);
  updateSkillE(dt);

  if (GAME.mode === 'battle') {
    GAME.spawnTimer -= dt;
    if (GAME.spawnTimer <= 0) {
      const t = GAME.time;
      const interval = Math.max(0.75, 2.6 - t / 80);
      GAME.spawnTimer = interval;
      const normalCount = enemies.filter(e => !e.dead && !e.isBoss).length;
      if (normalCount < 110) {
        const batch = 1 + Math.floor(t / 30);
        for (let i = 0; i < batch; i++) spawnEnemy();
      }
    }
    if (!GAME.bossActive && GAME.nextBossIdx < BOSS_DEFS.length) {
      if (GAME.time >= BOSS_DEFS[GAME.nextBossIdx].time) {
        spawnBoss(GAME.nextBossIdx);
      }
    }
  }

  let ix = 0, iy = 0;
  if (keys['KeyW']) iy -= 1;
  if (keys['KeyS']) iy += 1;
  if (keys['KeyA']) ix -= 1;
  if (keys['KeyD']) ix += 1;
  if (joystickActive) {
    ix = joystickVecX;
    iy = joystickVecY;
  }
  const il = Math.hypot(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }

  const baseSpeed = player.speed + stats.speed;
  const spd = baseSpeed;

  player.x += ix * spd * dt;
  player.y += iy * spd * dt;
  player.x = clamp(player.x, player.r, WORLD.w - player.r);
  player.y = clamp(player.y, player.r, WORLD.h - player.r);

  if (player.atk.active) {
    player.atk.t += dt;
    if (player.atk.t >= ATK.dur) { player.atk.active = false; player.atk.t = 0; }
  }

  autoCombat();

  processAttackHits();
  updateSwordAuras(dt);
  updateEnemies(dt);
  updateDummy(dt);
  updateDrops(dt);
  updateEffects(dt);
  updateCamera(dt);

  if (shake > 0) shake = Math.max(0, shake - dt * 1.6);
}

function updateEnemies(dt) {
  const px = player.x, py = player.y;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    if (e.spawnT < 1) e.spawnT = Math.min(1, e.spawnT + dt * 3.5);
    if (e.flash > 0)  e.flash -= dt;
    if (e.wobble > 0) e.wobble = Math.max(0, e.wobble - dt * 2.2);
    e.hpShown += (e.hp - e.hpShown) * Math.min(1, dt * 10);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    const damp = Math.exp(-9 * dt);
    e.vx *= damp; e.vy *= damp;
    const dx = px - e.x, dy = py - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    e.angle = Math.atan2(dy, dx);
    if (e.attackCd > 0) e.attackCd -= dt;
    if (!player.dead && e.spawnT >= 1) {
      const stopDist = e.r + player.r - 2;
      if (dist > stopDist) {
        e.x += (dx / dist) * e.speed * dt;
        e.y += (dy / dist) * e.speed * dt;
      }
      if (e.attackCd <= 0 && dist < e.r + player.r + 6) {
        damagePlayer(e.contactDamage);
        e.attackCd = e.isBoss ? 1.0 : rand(0.7, 1.1);
      }
    }
    e.x = clamp(e.x, e.r, WORLD.w - e.r);
    e.y = clamp(e.y, e.r, WORLD.h - e.r);
  }
  const cellSize = 70;
  const grid = {};
  for (const e of enemies) {
    if (e.dead) continue;
    const cx = Math.floor(e.x / cellSize);
    const cy = Math.floor(e.y / cellSize);
    const key = cx + ',' + cy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(e);
  }
  for (const key in grid) {
    const list = grid[key];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (a.isBoss && b.isBoss) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        const minD = a.r + b.r;
        if (d < minD && d > 0.0001) {
          const push = (minD - d) * 0.5;
          const nx = dx / d, ny = dy / d;
          const aw = a.isBoss ? 0 : 1;
          const bw = b.isBoss ? 0 : 1;
          a.x -= nx * push * aw; a.y -= ny * push * aw;
          b.x += nx * push * bw; b.y += ny * push * bw;
        }
      }
    }
  }
}

function updateDrops(dt) {
  const pickR = currentRange() * 2;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.life -= dt;
    d.spawnT = Math.min(1, d.spawnT + dt * 5);
    d.bob += dt * 3.5;
    if (d.life <= 0) {
      drops.splice(i, 1);
      continue;
    }
    const dist = Math.hypot(d.x - player.x, d.y - player.y);
    if (dist < pickR && !player.dead) {
      pickupDrop(d);
      drops.splice(i, 1);
    }
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const f = Math.exp(-4.2 * dt);
    p.vx *= f; p.vy *= f;
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    if (t.life <= 0) { texts.splice(i, 1); continue; }
    t.y += t.vy * dt;
    t.vy *= Math.exp(-2.2 * dt);
  }
}

function updateCamera(dt) {
  const tx = camTarget(player.x, W, WORLD.w);
  const ty = camTarget(player.y, H, WORLD.h);
  const lerp = Math.min(1, dt * 12);
  cam.x += (tx - cam.x) * lerp;
  cam.y += (ty - cam.y) * lerp;
}

function drawSwing() {
  if (!player.atk.active) return;
  const k = player.atk.t / ATK.dur;
  const e = easeOut(k);
  const a0 = player.angle - ATK.arc * 0.5;
  const a1 = a0 + ATK.arc * e;
  const R = currentRange() + 14;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, R, a0, a1);
  ctx.closePath();
  const g = safeRadial(0, 0, player.r, 0, 0, R);
  g.addColorStop(0,    'rgba(255,255,255,0.30)');
  g.addColorStop(0.55, 'rgba(190,235,255,0.22)');
  g.addColorStop(1,    'rgba(160,220,255,0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.86, Math.max(a0, a1 - 0.7), a1);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawSwordAura(s) {
  const lifeRatio = clamp(s.life / s.maxLife, 0, 1);
  const fade = lifeRatio > 0.9 ? (1 - lifeRatio) / 0.1 : 1;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);
  ctx.globalAlpha = fade;
  const g = safeRadial(0, 0, 4, 0, 0, s.r * 3.2);
  g.addColorStop(0,   'rgba(220,245,255,0.85)');
  g.addColorStop(0.35,'rgba(120,205,255,0.45)');
  g.addColorStop(1,   'rgba(50,120,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, s.r * 3.2, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 0, s.r * 0.42, s.r * 1.35, 0, 0, TAU);
  ctx.fillStyle = 'rgba(190,240,255,0.9)'; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(3, 0, s.r * 0.20, s.r * 0.85, 0, 0, TAU);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s.r * 0.42, 0);
  ctx.lineTo(s.r * 1.5, -s.r * 0.18);
  ctx.lineTo(s.r * 1.5,  s.r * 0.18);
  ctx.closePath();
  ctx.fillStyle = 'rgba(230,250,255,0.75)'; ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpinEffect() {
  if (!player.skillE.active) return;
  const R = spinRange();
  const t = player.skillE.t;
  const fadeIn  = Math.min(1, t / 0.18);
  const fadeOut = Math.min(1, (SKILL_E.duration - t) / 0.28);
  const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
  if (alpha <= 0) return;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.globalAlpha = alpha;
  const g = safeRadial(0, 0, player.r, 0, 0, R);
  g.addColorStop(0,    'rgba(150,220,255,0.22)');
  g.addColorStop(0.55, 'rgba(120,205,140,0.13)');
  g.addColorStop(1,    'rgba(80,180,90,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.strokeStyle = 'rgba(190,240,255,0.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 9]);
  ctx.lineDashOffset = -player.skillE.spinAngle * 10;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.rotate(player.skillE.spinAngle);
  for (let i = 0; i < 3; i++) {
    const baseA = (i / 3) * TAU;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.78, baseA - 0.28, baseA + 0.28);
    ctx.strokeStyle = 'rgba(220,250,255,0.85)';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.55, baseA + 0.4 - 0.18, baseA + 0.4 + 0.18);
    ctx.strokeStyle = 'rgba(180,240,180,0.7)';
    ctx.lineWidth = 5; ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPickupRing() {
  if (player.dead) return;
  const R = currentRange() * 2;
  const pulse = 0.5 + 0.5 * Math.sin(time * 2);
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.strokeStyle = 'rgba(255,215,60,' + (0.10 + pulse * 0.08) + ')';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 10]);
  ctx.stroke();
  ctx.restore();
}

function drawWeapon() {
  if (player.skillE.active) return;
  const wp = equipped.weapon;
  const isGold = wp && ITEM_DEFS[wp.defId].rarity === 'gold';
  const isHighLvl = wp && wp.level >= 5;
  let bladeColor = '#c9a06a';
  if (wp) {
    if (wp.defId === 'spirit_blade') bladeColor = '#c9a8ff';
    else if (wp.defId === 'iron_sword') bladeColor = '#dfe9f5';
    else if (isGold) bladeColor = '#ffd94a';
  }
  let a = player.angle;
  if (player.atk.active) {
    const e = easeOut(player.atk.t / ATK.dur);
    a = player.angle - ATK.arc * 0.5 + ATK.arc * e;
  }
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(a);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(16, 0);
  ctx.lineWidth = 7; ctx.strokeStyle = '#6b4a2a'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, -9); ctx.lineTo(16, 9);
  ctx.lineWidth = 4; ctx.strokeStyle = '#c8b06a'; ctx.stroke();
  if (isGold || isHighLvl) {
    ctx.save();
    ctx.shadowColor = isGold ? 'rgba(255,205,50,.95)' : 'rgba(180,230,255,.8)';
    ctx.shadowBlur = isGold ? 14 : 10;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(58, 0);
    ctx.lineWidth = 8; ctx.strokeStyle = bladeColor; ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(58, 0);
  ctx.lineWidth = 7; ctx.strokeStyle = bladeColor; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(56, 0);
  ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(58, -4); ctx.lineTo(66, 0); ctx.lineTo(58, 4);
  ctx.closePath(); ctx.fillStyle = isGold ? '#fff3b0' : '#eef6ff'; ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  const alpha = player.dead ? 0.32 : (player.invuln > 0 ? 0.6 + 0.4 * Math.sin(time * 40) : 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.ellipse(player.x, player.y + 9, player.r * 1.1, player.r * 0.5, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  drawSpinEffect();
  drawSwing();
  ctx.save();
  ctx.translate(player.x, player.y);
  const armorTint = equipped.armor
    ? (equipped.armor.defId === 'chain_armor' ? ['#d8e6f0', '#6a8aa8']
      : equipped.armor.defId === 'dragon_armor' ? ['#ffe7a8', '#b8801e']
      : ['#d8c9a8', '#8a7a58'])
    : ['#a9dcff', '#3b7fc4'];
  ctx.beginPath(); ctx.arc(0, 0, player.r, 0, TAU);
  const g = safeRadial(-5, -5, 3, 0, 0, player.r);
  g.addColorStop(0, armorTint[0]);
  g.addColorStop(1, armorTint[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#1c3f63'; ctx.stroke();
  if (player.hurtFlash > 0) {
    ctx.globalAlpha = (player.hurtFlash / 0.35) * 0.85;
    ctx.beginPath(); ctx.arc(0, 0, player.r + 1, 0, TAU);
    ctx.fillStyle = '#ff4030'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (equipped.helmet) {
    ctx.beginPath();
    ctx.arc(0, -3, player.r * 0.62, Math.PI * 1.05, Math.PI * 1.95);
    ctx.lineWidth = 6;
    ctx.strokeStyle = equipped.helmet.defId === 'iron_helm' ? '#b8c6d4'
                    : equipped.helmet.defId === 'demon_helm' ? '#c03a3a' : '#c9a86a';
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.save();
  ctx.rotate(player.angle);
  ctx.beginPath();
  ctx.moveTo(player.r + 3, 0);
  ctx.lineTo(player.r - 8, -7);
  ctx.lineTo(player.r - 8, 7);
  ctx.closePath();
  ctx.fillStyle = '#eaf7ff'; ctx.fill();
  ctx.restore();
  ctx.restore();
  drawWeapon();
  ctx.restore();
}

function drawEnemy(e) {
  if (e.dead) return;
  const t = easeOut(e.spawnT);
  const r = e.r * (0.45 + 0.55 * t);
  ctx.save();
  ctx.globalAlpha = t;
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + r * 0.6, r * 1.05, r * 0.45, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.wobble > 0) ctx.rotate(Math.sin(time * 40) * e.wobble * 0.2);
  const pal = e.palette;
  const g = safeRadial(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, pal.a);
  g.addColorStop(0.6, pal.b);
  g.addColorStop(1, pal.c);
  if (e.isBoss) {
    ctx.save();
    ctx.shadowColor = e.bossColor;
    ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.lineWidth = e.isBoss ? 4 : 2.5;
  ctx.strokeStyle = e.isBoss ? '#000' : '#3d0a03';
  ctx.stroke();
  ctx.save();
  ctx.rotate(e.angle);
  const eyeR = e.isBoss ? r * 0.18 : r * 0.17;
  ctx.beginPath();
  ctx.arc(r * 0.40, -r * 0.30, eyeR, 0, TAU);
  ctx.arc(r * 0.40,  r * 0.30, eyeR, 0, TAU);
  ctx.fillStyle = e.isBoss ? '#fff7c0' : '#ffe9e0'; ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 0.48, -r * 0.30, eyeR * 0.5, 0, TAU);
  ctx.arc(r * 0.48,  r * 0.30, eyeR * 0.5, 0, TAU);
  ctx.fillStyle = '#26060a'; ctx.fill();
  ctx.restore();
  if (e.isBoss) {
    ctx.save();
    ctx.rotate(-Math.PI / 2 + Math.sin(time * 1.5) * 0.1);
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.55);
    ctx.lineTo(-r * 0.30, -r * 0.95);
    ctx.lineTo(-r * 0.10, -r * 0.6);
    ctx.lineTo( 0,         -r * 1.05);
    ctx.lineTo( r * 0.10, -r * 0.6);
    ctx.lineTo( r * 0.30, -r * 0.95);
    ctx.lineTo( r * 0.55, -r * 0.55);
    ctx.closePath();
    ctx.fillStyle = '#ffd94a';
    ctx.strokeStyle = '#a06000';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (e.flash > 0) {
    ctx.globalAlpha = (e.flash / 0.16) * 0.8 * t;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.globalAlpha = t;
  }
  ctx.restore();
  if (!e.isBoss) {
    const ratio = clamp(e.hpShown / e.maxHp, 0, 1);
    const bw = 40, bh = 5;
    const bx = e.x - bw / 2, by = e.y - e.r - 15;
    ctx.globalAlpha = t;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(bx - 1.5, by - 1.5, bw + 3, bh + 3, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(bx, by, bw, bh, 2.5); ctx.fill();
    ctx.fillStyle = ratio > 0.5 ? '#ff8a6a' : ratio > 0.25 ? '#ffb03c' : '#ff4a3a';
    roundRect(bx, by, bw * ratio, bh, 2.5); ctx.fill();
  }
  ctx.restore();
}

function drawDummy() {
  if (GAME.mode !== 'train' || dummy.dead) return;
  const r = dummy.r;
  ctx.beginPath();
  ctx.ellipse(dummy.x, dummy.y + 8, r * 1.15, r * 0.5, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.save();
  ctx.translate(dummy.x, dummy.y);
  if (dummy.wobble > 0) ctx.rotate(Math.sin(time * 42) * dummy.wobble * 0.26);
  const grad = safeRadial(-r * 0.35, -r * 0.35, r * 0.15, 0, 0, r);
  grad.addColorStop(0,   '#d2ab74');
  grad.addColorStop(0.7, '#a97c46');
  grad.addColorStop(1,   '#7d5730');
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,30,0.42)';
  ctx.lineWidth = 2;
  [0.72, 0.5, 0.28].forEach(f => {
    ctx.beginPath(); ctx.arc(0, 0, r * f, 0, TAU); ctx.stroke();
  });
  ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, TAU);
  ctx.fillStyle = 'rgba(90,60,30,0.5)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  ctx.strokeStyle = '#5b3d1f'; ctx.lineWidth = 3; ctx.stroke();
  if (dummy.flash > 0) {
    ctx.globalAlpha = (dummy.flash / 0.16) * 0.85;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  const ratio = clamp(dummy.hpShown / dummy.maxHp, 0, 1);
  const bw = 64, bh = 8;
  const bx = dummy.x - bw / 2, by = dummy.y - r - 28;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  roundRect(bx, by, bw, bh, 3); ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? '#5ddc6a' : ratio > 0.25 ? '#ffc93c' : '#ff5c4d';
  roundRect(bx, by, bw * ratio, bh, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1;
  roundRect(bx, by, bw, bh, 3); ctx.stroke();
}

function drawDrop(d) {
  const def = ITEM_DEFS[d.defId];
  if (!def) return;
  const rar = RARITY[def.rarity];
  const t = easeOut(d.spawnT);
  const bobY = Math.sin(d.bob) * 4;
  ctx.save();
  ctx.globalAlpha = t;
  const g = safeRadial(d.x, d.y + bobY, 2, d.x, d.y + bobY, 40);
  g.addColorStop(0, rar.color + 'cc');
  g.addColorStop(0.5, rar.color + '55');
  g.addColorStop(1, rar.color + '00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(d.x, d.y + bobY, 40, 0, TAU); ctx.fill();
  ctx.font = '26px system-ui, "Segoe UI Emoji", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(def.icon, d.x, d.y + bobY);
  ctx.beginPath();
  ctx.arc(d.x, d.y + bobY, 20, 0, TAU);
  ctx.strokeStyle = rar.color;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = a;
    let size = 20;
    if (t.hurt) size = 22;
    else if (t.heal) size = 22;
    else if (t.autoEquip) size = 15;
    else if (t.pickup) size = t.leveled ? 19 : 17;
    else if (t.bossWarning) size = 32;
    else if (t.skill) size = 30;
    else if (t.crit) size = 27;
    ctx.font = 'bold ' + size + 'px system-ui, "Microsoft YaHei", sans-serif';
    ctx.lineWidth = t.bossWarning ? 6 : 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.78)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.hurt ? '#ff6b5a'
                  : t.heal ? '#7dff9a'
                  : t.autoEquip ? '#ffe27a'
                  : t.pickup ? (t.leveled ? '#ffd94a' : '#ffe27a')
                  : t.bossWarning ? '#ff5c9a'
                  : t.skill ? '#a8e06b'
                  : (t.crit ? '#ffd35c' : '#ffffff');
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPlayerHealth() {
  const x = 80, y = 22, bw = 250, bh = 18;
  const ratio = clamp(player.hp / player.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.58)';
  roundRect(x - 3, y - 3, bw + 6, bh + 6, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  roundRect(x, y, bw, bh, 4); ctx.fill();
  const col = ratio > 0.5 ? '#5ddc6a' : ratio > 0.25 ? '#ffc93c' : '#ff5c4d';
  ctx.fillStyle = col;
  roundRect(x, y, bw * ratio, bh, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.lineWidth = 1.5;
  roundRect(x, y, bw, bh, 4); ctx.stroke();
  ctx.save();
  ctx.font = 'bold 12px system-ui, "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(player.hp) + ' / ' + player.maxHp, x + 10, y + bh / 2 + 1);
  if (stats.lifesteal > 0) {
    ctx.font = 'bold 11px system-ui, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff8fa0';
    ctx.fillText('♥ 吸血 ' + Math.round(stats.lifesteal * 100) + '%', x + bw, y - 8);
    ctx.textAlign = 'left';
  }
  ctx.font = 'bold 11px system-ui, "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,230,180,.75)';
  ctx.fillText('HP', x, y - 12);
  ctx.restore();
}

function drawGameInfo() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 26px system-ui, "Microsoft YaHei", sans-serif';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,.7)';
  ctx.strokeText(formatTime(GAME.time), W / 2, 42);
  ctx.fillStyle = '#eaf5dd';
  ctx.fillText(formatTime(GAME.time), W / 2, 42);
  if (GAME.mode === 'train') {
    ctx.font = 'bold 12px system-ui, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,200,100,.85)';
    ctx.fillText('🎯 训练模式', W / 2, 62);
  }
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px system-ui, "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  if (GAME.mode === 'battle') {
    ctx.fillText('击杀  ' + GAME.killCount, W - 80, 34);
  }
  ctx.fillText('掉落  ' + GAME.dropCount, W - 80, 56);
  ctx.fillStyle = 'rgba(255,220,80,.7)';
  ctx.fillText('升级  ' + GAME.upgradeCount, W - 80, 78);
  ctx.fillStyle = 'rgba(255,200,120,.75)';
  ctx.fillText('⚡ 自动装备', W - 80, 100);
  if (selectedTalent) {
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px system-ui, "Microsoft YaHei", sans-serif';
    const tName = selectedTalent === 'aura' ? '🌀 剑气宗师' : '⚡ 疾风之刃';
    const tCol  = selectedTalent === 'aura' ? '#7fd0ff' : '#a8e06b';
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    roundRect(80, 50, 108, 24, 6); ctx.fill();
    ctx.fillStyle = tCol;
    ctx.textBaseline = 'middle';
    ctx.fillText(tName, 92, 63);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}

function drawBossBar() {
  if (!GAME.bossActive || !GAME.bossRef) return;
  const boss = GAME.bossRef;
  if (boss.dead) return;
  const bw = Math.min(620, W - 100), bh = 22;
  const bx = W / 2 - bw / 2, by = 130;
  const ratio = clamp(boss.hpShown / boss.maxHp, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  roundRect(bx - 3, by - 3, bw + 6, bh + 6, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  roundRect(bx, by, bw, bh, 4); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, boss.bossColor);
  g.addColorStop(1, '#ff2a4a');
  ctx.fillStyle = g;
  roundRect(bx, by, bw * ratio, bh, 4); ctx.fill();
  ctx.strokeStyle = boss.bossColor;
  ctx.lineWidth = 2;
  roundRect(bx, by, bw, bh, 4); ctx.stroke();
  ctx.font = 'bold 15px system-ui, "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.strokeText('☠ ' + boss.bossName, bx, by - 8);
  ctx.fillStyle = boss.bossColor;
  ctx.fillText('☠ ' + boss.bossName, bx, by - 8);
  ctx.textAlign = 'right';
  ctx.font = 'bold 12px system-ui, "Microsoft YaHei", sans-serif';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.strokeText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, bx + bw, by - 8);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, bx + bw, by - 8);
  ctx.restore();
}

function drawNextBossTimer() {
  if (GAME.mode !== 'battle') return;
  if (GAME.bossActive) return;
  if (GAME.nextBossIdx >= BOSS_DEFS.length) return;
  const next = BOSS_DEFS[GAME.nextBossIdx];
  const remain = Math.max(0, next.time - GAME.time);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 14px system-ui, "Microsoft YaHei", sans-serif';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,.75)';
  const label = '下一个 BOSS：' + next.name + '  ' + Math.ceil(remain) + 's';
  ctx.strokeText(label, W / 2, 76);
  ctx.fillStyle = remain < 10 ? '#ff5c9a' : 'rgba(255,180,220,.9)';
  ctx.fillText(label, W / 2, 76);
  ctx.restore();
}

function drawSkillSlot(x, y, w, h, opt) {
  const ready = opt.cd <= 0;
  const cdRatio = opt.maxCd > 0 ? opt.cd / opt.maxCd : 0;
  const isActive = !!opt.active;
  ctx.save();
  ctx.fillStyle = 'rgba(6,14,22,.82)';
  roundRect(x, y, w, h, 12); ctx.fill();
  ctx.lineWidth = 2.5;
  if (isActive) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 10);
    ctx.save();
    ctx.shadowColor = 'rgba(150,240,120,' + (0.6 + pulse * 0.4) + ')';
    ctx.shadowBlur = 22;
    ctx.strokeStyle = '#a8e06b';
    roundRect(x, y, w, h, 12); ctx.stroke();
    ctx.restore();
  } else if (ready) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    ctx.save();
    ctx.shadowColor = 'rgba(120,215,255,' + (0.55 + pulse * 0.45) + ')';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(140,225,255,.95)';
    roundRect(x, y, w, h, 12); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = 'rgba(90,120,140,.6)';
    roundRect(x, y, w, h, 12); ctx.stroke();
  }
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - 4);
  ctx.globalAlpha = (ready || isActive) ? 1 : 0.32;
  opt.drawIcon(ctx);
  ctx.restore();
  if (!ready && !isActive) {
    ctx.save();
    ctx.beginPath();
    roundRect(x, y, w, h, 12);
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(x, y + h * (1 - cdRatio), w, h * cdRatio);
    ctx.restore();
    ctx.font = 'bold 22px system-ui, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(opt.cd.toFixed(1), x + w / 2, y + h / 2 - 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(opt.cd.toFixed(1), x + w / 2, y + h / 2 - 2);
  }
  if (isActive && opt.duration) {
    const tRatio = clamp(opt.activeT / opt.duration, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    roundRect(x + 4, y + h - 10, w - 8, 5, 2.5); ctx.fill();
    ctx.fillStyle = '#a8e06b';
    roundRect(x + 4, y + h - 10, (w - 8) * (1 - tRatio), 5, 2.5); ctx.fill();
  }
  ctx.font = 'bold 11px system-ui, "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = (ready || isActive) ? 'rgba(160,225,255,.9)' : 'rgba(140,160,175,.6)';
  ctx.fillText('自动', x + w / 2, y + h - 14);
  ctx.font = '12px system-ui, "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,230,255,.65)';
  ctx.fillText(opt.name, x + w / 2, y - 8);
  ctx.restore();
}

function iconAura(c) {
  const gg = safeRadial(0, 0, 1, 0, 0, 24);
  gg.addColorStop(0, 'rgba(200,245,255,.9)');
  gg.addColorStop(1, 'rgba(90,180,255,0)');
  c.fillStyle = gg;
  c.beginPath(); c.arc(0, 0, 24, 0, TAU); c.fill();
  c.beginPath();
  c.ellipse(0, 0, 5, 17, 0, 0, TAU);
  c.fillStyle = '#dff4ff'; c.fill();
  c.beginPath();
  c.moveTo(5, 0); c.lineTo(19, -3); c.lineTo(19, 3);
  c.closePath();
  c.fillStyle = 'rgba(220,250,255,.85)'; c.fill();
}
function iconSpin(c) {
  const gg = safeRadial(0, 0, 1, 0, 0, 24);
  gg.addColorStop(0, 'rgba(200,255,200,.85)');
  gg.addColorStop(1, 'rgba(80,200,100,0)');
  c.fillStyle = gg;
  c.beginPath(); c.arc(0, 0, 24, 0, TAU); c.fill();
  c.save();
  c.rotate(time * 6);
  c.beginPath(); c.arc(0, 0, 15, -0.5, 0.5);
  c.strokeStyle = 'rgba(200,255,200,.9)';
  c.lineWidth = 4; c.lineCap = 'round'; c.stroke();
  c.beginPath(); c.arc(0, 0, 15, Math.PI - 0.5, Math.PI + 0.5);
  c.strokeStyle = 'rgba(160,240,160,.85)';
  c.lineWidth = 4; c.stroke();
  c.restore();
  c.beginPath(); c.arc(0, 0, 3.5, 0, TAU);
  c.fillStyle = '#eaffea'; c.fill();
}

function drawSkillBar() {
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  if (isTouch) return;
  const bw = 74, bh = 74, gap = 12;
  const totalW = bw * 2 + gap;
  const startX = W / 2 - totalW / 2;
  const by = H - 96;
  drawSkillSlot(startX, by, bw, bh, {
    name: '剑气',
    cd: player.skill1.cd, maxCd: SKILL1.cd,
    drawIcon: iconAura
  });
  drawSkillSlot(startX + bw + gap, by, bw, bh, {
    name: '旋风',
    cd: player.skillE.cd, maxCd: SKILL_E.cd,
    active: player.skillE.active, activeT: player.skillE.t,
    duration: SKILL_E.duration, drawIcon: iconSpin
  });
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  ctx.font = '13.5px system-ui, "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  if (!isTouch) {
    ctx.fillText('WASD 移动 · 全自动战斗 + 自动装备 · I 背包 · ESC 返回', 20, H - 20);
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.font = '12.5px system-ui, "Microsoft YaHei", sans-serif';
  let line = '攻击 +' + stats.atk + '  ·  暴击 ' + Math.round(stats.crit * 100) + '%' +
             '  ·  范围 +' + stats.range + '  ·  速度 +' + stats.speed;
  if (stats.lifesteal > 0) line += '  ·  吸血 ' + Math.round(stats.lifesteal * 100) + '%';
  ctx.fillText(line, W - 80, H - 20);
  ctx.restore();
}

function drawHurtOverlay() {
  if (player.hurtFlash <= 0 && !player.dead) return;
  const a = player.dead ? 0.42 : (player.hurtFlash / 0.35) * 0.38;
  const cx = W / 2, cy = H / 2;
  const innerR = Math.max(1, Math.min(W, H) * 0.22);
  const outerR = Math.max(innerR + 1, Math.max(W, H) * 0.72);
  const g = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
  g.addColorStop(0, 'rgba(190,20,20,0)');
  g.addColorStop(1, 'rgba(190,20,20,' + a.toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  let ox = 0, oy = 0;
  if (shake > 0) {
    ox = rand(-1, 1) * shake * 16;
    oy = rand(-1, 1) * shake * 16;
  }
  ctx.save();
  ctx.translate(-Math.round(cam.x) + ox, -Math.round(cam.y) + oy);
  ctx.drawImage(ground, 0, 0);
  ctx.strokeStyle = '#0f1a0c';
  ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, WORLD.w - 10, WORLD.h - 10);
  ctx.strokeStyle = 'rgba(120,180,100,0.14)';
  ctx.lineWidth = 2;
  ctx.strokeRect(12, 12, WORLD.w - 24, WORLD.h - 24);
  drawPickupRing();
  for (const d of drops) drawDrop(d);
  for (const e of enemies) drawEnemy(e);
  drawDummy();
  drawPlayer();
  for (const s of swordAuras) drawSwordAura(s);
  drawParticles();
  drawTexts();
  ctx.restore();
  drawPlayerHealth();
  drawGameInfo();
  drawNextBossTimer();
  drawBossBar();
  drawSkillBar();
  drawHUD();
  drawHurtOverlay();
}

const screenEl    = document.getElementById('screen');
const screenTitle = document.getElementById('screenTitle');
const screenSub   = document.getElementById('screenSub');
const screenStats = document.getElementById('screenStats');
const screenBtn   = document.getElementById('screenBtn');
const screenHint  = document.getElementById('screenHint');
const mainMenuArea = document.getElementById('mainMenuArea');
const talentArea   = document.getElementById('talentArea');

const MAIN_MENU_HTML =
  '<b>WASD / 摇杆</b> 移动 · <b>全自动战斗 + 自动装备</b><br>' +
  '攻击、剑气、旋风都会自动释放并瞄准最近的敌人<br>' +
  '捡到更强的装备自动换上<br><br>' +
  '选择 <b>开始游戏</b> 挑战完整流程，或进入 <b>训练模式</b> 熟悉操作。';

const BATTLE_TALENT_HTML =
  '怪物源源不断袭来，每 <b>120 秒</b> 刷新一位 <b>BOSS</b>。<br>' +
  '击杀 <b>第三位 BOSS</b> 即为胜利。<br>' +
  '捡到<b>相同装备</b>会升级（每级 +20% 属性，<b>无上限</b>）。<br>' +
  '<b>攻击、技能、装备全部自动，你只需要专心走位。</b>';

const TRAIN_TALENT_HTML =
  '训练模式：只有木桩，不会刷新怪物和 BOSS。<br>' +
  '打木桩可以练习走位、测试天赋、刷装备。<br>' +
  '木桩被击碎后会立即重生并掉落装备。<br>' +
  '<b>攻击、技能、装备全部自动，专心走位即可。</b>';

function updateTopBtns() {
  const show = GAME.state === 'playing';
  btnHome.style.display = show ? 'flex' : 'none';
  btnBag.style.display  = show ? 'flex' : 'none';
}

function showMainMenu() {
  GAME.state = 'mainMenu';
  selectedTalent = null;
  panelOpen = false;
  panelEl.classList.remove('open');
  resetJoystick();
  screenTitle.textContent = '幸存者试炼';
  screenTitle.className = '';
  screenSub.innerHTML = MAIN_MENU_HTML;
  mainMenuArea.style.display = 'flex';
  talentArea.style.display = 'none';
  screenStats.style.display = 'none';
  screenStats.innerHTML = '';
  screenBtn.style.display = 'none';
  screenHint.textContent = '选择模式，开始试炼。';
  screenEl.classList.remove('hidden');
  updateTopBtns();
}

function showTalentSelect() {
  GAME.state = 'talentSelect';
  selectedTalent = null;
  if (GAME.mode === 'train') {
    screenTitle.textContent = '训练模式';
    screenTitle.className = 'win';
    screenSub.innerHTML = TRAIN_TALENT_HTML;
  } else {
    screenTitle.textContent = '幸存者试炼';
    screenTitle.className = '';
    screenSub.innerHTML = BATTLE_TALENT_HTML;
  }
  mainMenuArea.style.display = 'none';
  talentArea.style.display = 'flex';
  screenStats.style.display = 'none';
  screenBtn.style.display = 'none';
  screenHint.textContent = '点击天赋卡片，开始试炼。';
  screenEl.classList.remove('hidden');
  updateTopBtns();
}

function startGame() {
  resetGame();
  screenEl.classList.add('hidden');
  updateTopBtns();
}

function showEndScreen(title, sub, statsHtml, extraClass, hintText) {
  screenTitle.textContent = title;
  screenTitle.className = extraClass || '';
  screenSub.innerHTML = sub;
  screenStats.style.display = 'block';
  screenStats.innerHTML = statsHtml;
  screenBtn.textContent = '返 回 主 菜 单';
  screenBtn.style.display = 'inline-block';
  mainMenuArea.style.display = 'none';
  talentArea.style.display = 'none';
  screenHint.textContent = hintText;
  screenEl.classList.remove('hidden');
  updateTopBtns();
}

mainMenuArea.addEventListener('click', e => {
  const btn = e.target.closest('.menu-btn');
  if (!btn) return;
  if (GAME.state !== 'mainMenu') return;
  GAME.mode = btn.dataset.mode;
  showTalentSelect();
});

talentArea.addEventListener('click', e => {
  const card = e.target.closest('.talent-card');
  if (!card) return;
  if (GAME.state !== 'talentSelect') return;
  selectedTalent = card.dataset.talent;
  startGame();
});

screenBtn.addEventListener('click', () => {
  showMainMenu();
});

function resetGame() {
  player.x = WORLD.w / 2;
  player.y = WORLD.h / 2;
  player.hp = player.maxHp;
  player.dead = false;
  player.invuln = 1.2;
  player.hurtFlash = 0;
  player.atk.active = false;
  player.atk.t = 0;
  player.atk.cd = 0;
  player.atk.hit.clear();
  player.skill1.cd = 0;
  player.skillE.cd = 0;
  player.skillE.active = false;
  player.skillE.t = 0;
  player.skillE.tickTimer = 0;
  enemies.length = 0;
  drops.length = 0;
  swordAuras.length = 0;
  particles.length = 0;
  texts.length = 0;
  shake = 0;
  time = 0;
  resetJoystick();
  dummy.x = WORLD.w / 2 + 200;
  dummy.y = WORLD.h / 2;
  dummy.hp = dummy.maxHp;
  dummy.hpShown = dummy.maxHp;
  dummy.flash = 0;
  dummy.wobble = 0;
  dummy.dead = false;
  dummy.respawn = 0;
  applyTalent();
  GAME.state = 'playing';
  GAME.time = 0;
  GAME.spawnTimer = 1.2;
  GAME.nextBossIdx = 0;
  GAME.bossActive = false;
  GAME.bossRef = null;
  GAME.killCount = 0;
  GAME.dropCount = 0;
  GAME.upgradeCount = 0;
  inventory.length = 0;
  ['wood_sword','cloth_hat','cloth_armor','straw_shoes'].forEach(k => {
    inventory.push({ uid: ++uidCounter, defId: k, level: 1 });
  });
  equipped.helmet = null;
  equipped.armor = null;
  equipped.weapon = null;
  equipped.boots = null;
  computeStats();
  renderPanel();
  /* ★ 初始也自动装备最强（会把基础四件穿上） */
  autoEquipBest(true);
  panelOpen = false;
  panelEl.classList.remove('open');
  hideTooltip();
  snapCamera();
}

function winGame() {
  GAME.state = 'won';
  updateTopBtns();
  const statsHtml =
    '存活时间 &nbsp;<span>' + formatTime(GAME.time) + '</span><br>' +
    '击杀数 &nbsp;<span>' + GAME.killCount + '</span><br>' +
    '拾取装备 &nbsp;<span>' + GAME.dropCount + '</span><br>' +
    '装备升级 &nbsp;<span>' + GAME.upgradeCount + '</span>';
  showEndScreen('胜  利  ！', '你击败了深渊魔龙，成为真正的幸存者。',
    statsHtml, 'win', '了不起，幸存者。');
}

function loseGame() {
  GAME.state = 'lost';
  player.dead = true;
  shake = 0.7;
  updateTopBtns();
  for (let i = 0; i < 40; i++) {
    const a = rand(0, TAU), s = rand(60, 280);
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.4, 1.1), max: 1.1,
      size: rand(2, 5), color: '#7fc8ff'
    });
  }
  const nextName = GAME.nextBossIdx < BOSS_DEFS.length
    ? BOSS_DEFS[GAME.nextBossIdx].name : '——';
  const statsHtml =
    '存活时间 &nbsp;<span>' + formatTime(GAME.time) + '</span><br>' +
    '击杀数 &nbsp;<span>' + GAME.killCount + '</span><br>' +
    '拾取装备 &nbsp;<span>' + GAME.dropCount + '</span><br>' +
    '装备升级 &nbsp;<span>' + GAME.upgradeCount + '</span><br>' +
    '倒在了 &nbsp;<span>' + nextName + '</span> 面前';
  showEndScreen('被 击 败 了', '深渊吞噬了你的灵魂……',
    statsHtml, 'lose', '下次一定行。');
}

let last = performance.now();
let loopBroken = false;

function loop(now) {
  try {
    let dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    if (GAME.state === 'playing' && !panelOpen) {
      update(dt);
    } else if (GAME.state === 'playing' && panelOpen) {
      /* 暂停 */
    } else {
      update(dt);
    }
    render();
  } catch (err) {
    if (!loopBroken) {
      loopBroken = true;
      errBox.style.display = 'block';
      errBox.textContent = '运行错误：\n' + (err && err.stack ? err.stack : err);
      console.error(err);
    }
  }
  requestAnimationFrame(loop);
}

computeStats();
renderPanel();
snapCamera();
showMainMenu();
requestAnimationFrame(loop);
</script>
